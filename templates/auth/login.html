{% extends "base.html" %}

{% block title %}Sign In | MedCost AI{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 28px;">
            <div style="font-size: 2.5rem; margin-bottom: 10px;">🔐</div>
            <h2 style="font-size: 1.6rem; color: var(--secondary);">Welcome Back</h2>
            <p style="color: var(--slate-500); font-size: 0.9rem; margin-top: 4px;">Sign in to access your dashboard & prediction models</p>
        </div>

        <form action="{{ url_for('auth.login', next=request.args.get('next', '')) }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-control" 
                    placeholder="Enter your username" 
                    value="{{ username or '' }}"
                    required 
                    autofocus
                >
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label class="form-label" for="password" style="margin-bottom:0;">Password</label>
                </div>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control" 
                    placeholder="Enter your password" 
                    required
                >
            </div>

            <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="remember" name="remember" style="width: auto; margin:0;">
                <label for="remember" style="font-size: 0.85rem; color: var(--slate-600); cursor: pointer;">Remember this session</label>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="padding: 13px; font-size: 1rem; margin-top: 10px;">
                Sign In to Dashboard
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--slate-200); font-size: 0.9rem; color: var(--slate-600);">
            Don't have an account? 
            <a href="{{ url_for('auth.register') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}
